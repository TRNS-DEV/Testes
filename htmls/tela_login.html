<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="../css/login_style.css">
    

</head>

<body>
    <!-- Container principal da tela de login -->
    <div class="login-container">
        <h2>Entrar</h2>
        <!-- Formulário utilizado para autenticação do usuário -->
        <form>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <div class="options">
                <label><input type="checkbox"> Lembrar de mim</label>
                <a href="alteracao_senha.html">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-login">Acessar</button>
        </form>
        <p class="signup-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
</body>

</html>
