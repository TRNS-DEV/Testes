<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="../css/alteracao_perfil.css">
</head>
<body>

    <!-- Botão de Voltar no canto superior esquerdo -->
    <button class="btn-back" onclick="history.back()">
      <a href="perfil.html"><span>←</span> Voltar</a></a>  
    </button>

    <div class="profile-container">
        <!-- Cabeçalho -->
        <div class="profile-header">
            <div class="avatar-container">
                <div class="avatar-wrapper">
                    <!-- Elemento da foto de perfil -->
                    <div class="avatar-placeholder" id="avatarPreview">👤</div>
                    
                    <!-- Botão verde para trocar a foto de perfil -->
                    <label for="fileInput" class="btn-change-avatar" title="Trocar foto de perfil">
                        📷
                    </label>
                    <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
                </div>
            </div>
            <h2>Meu Perfil</h2>
            <p class="subtitle">Mantenha seus dados pessoais e de localização atualizados</p>
        </div>

        <!-- Formulário Organizado -->
        <form onsubmit="event.preventDefault();">
            <div class="form-grid">
                
                <!-- Informações Pessoais -->
                <div class="input-group full-width">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" value="Nome do Usuário">
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <div class="input-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" value="(11) 99999-9999">
                </div>

                <div class="input-group full-width">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" value="usuario@email.com">
                </div>
                
                <!-- Informações de Localização -->
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000">
                </div>

                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Ex: São Paulo">
                </div>

                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Ex: Centro">
                </div>

                <div class="input-group">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" placeholder="Ex: SP">
                </div>

                <!-- NOVO CAMPO: Ponto de Referência -->
                <div class="input-group full-width">
                    <label for="referencia">Ponto de Referência</label>
                    <input type="text" id="referencia" placeholder="Ex: Próximo ao mercado, em frente à praça...">
                </div>

            </div>

            <!-- Grupo do Botão de Ação -->
            <div class="button-group">
                <button type="submit" class="btn-save">Salvar Alterações</button>
            </div>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('avatarPreview');
                output.textContent = '';
                output.style.backgroundImage = `url('${reader.result}')`;
                output.style.backgroundSize = 'cover';
                output.style.backgroundPosition = 'center';
            }
            if(event.target.files) {
                reader.readAsDataURL(event.target.files);
            }
        }
    </script>
</body>
</html>
